# Local observability backend: Grafana + Tempo (traces) + Prometheus/Mimir (metrics) + Loki (logs)
# Grafana: http://localhost:3000 (admin/admin) · OTLP gRPC :4317 · OTLP HTTP :4318
services:
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: analytax-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm-data:/data

volumes:
  lgtm-data:
