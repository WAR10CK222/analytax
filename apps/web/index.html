<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Analytax: watch a team of AI agents plan, research and answer your question." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M9 23l5.4-14h3.2L23 23h-3.1l-1.2-3.3h-5.4L12.1 23zm4.6-5.8h3.8L15.5 12z' fill='%23fcfcfc'/%3E%3C/svg%3E"
    />
    <title>Analytax</title>
    <script>
      // Apply a saved light/dark choice before first paint (no flash). "system" leaves the attribute unset.
      try {
        var saved = localStorage.getItem("analytax.theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
